name: CI

# Fast verification on every push/PR. The Release workflow remains the full
# gate (complete pytest incl. twin contracts, frozen bundle + smoke, signed
# manifest); CI catches breakage early, especially packaging inputs that used
# to fail only at release time (v7.3.0: spec bundled a gitignored Go binary
# that a fresh checkout does not have).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-core/go.mod

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Go backend
        shell: pwsh
        run: |
          cd go-core
          go build -o webshare-core.exe ./cmd/webshare-core
          go vet ./...
          go test ./...

      - name: Packaging inputs exist
        run: python scripts/check_packaging_artifacts.py

      - name: Static types
        run: python -m pyright

      - name: Fast Python tests
        run: >
          python -m pytest -q
          --ignore=tests/test_milestone_b_parity.py
          --ignore=tests/test_milestone_c_contract.py
          --ignore=tests/test_milestone_def_contract.py
