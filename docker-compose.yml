services:
  webshare:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webshare
    ports:
      - "5000:5000"
    volumes:
      - ./shared_files:/data
    environment:
      WEBSHARE_FOLDER: /data
      WEBSHARE_HOST: 0.0.0.0
      WEBSHARE_PORT: 5000
    restart: unless-stopped

