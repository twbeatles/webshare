services:
  webshare:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webshare
    ports:
      - "5000:5000"
    volumes:
      - ./shared_files:/data
    environment:
      WEBSHARE_FOLDER: /data
      WEBSHARE_HOST: 0.0.0.0
      WEBSHARE_PORT: 5000
      WEBSHARE_ADMIN_PASSWORD: ${WEBSHARE_ADMIN_PASSWORD:-}
      WEBSHARE_GUEST_PASSWORD: ${WEBSHARE_GUEST_PASSWORD:-}
      WEBSHARE_SECRET_KEY: ${WEBSHARE_SECRET_KEY:-}
    restart: unless-stopped
