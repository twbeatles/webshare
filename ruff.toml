# webshare Ruff staged rollout: S1 -> S2 (I) -> S3 (B); S4 (UP) deferred.
# legacy/ is documented dead code (legacy/README.md: historical reference
# only, zero importers, "Do not import") - excluded from lint scope.
# E402 exclusions below are load-bearing bootstraps (sys.path / workdir setup
# must precede imports; in-code comments mark them).
line-length = 88
preview = false
exclude = ["legacy/"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
fixable = []

[lint.per-file-ignores]
"main.py" = ["E402"]
"scripts/apply_update.py" = ["E402"]
"scripts/build_update_manifest.py" = ["E402"]
"scripts/verify_update_release_key.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_perf_hotpaths.py" = ["E402"]
