<script>
            {% if go_shell %}
            // Go 백엔드 셸: 요청별 경로는 서버가 JSON 문자열로 치환한다
            window.CURRENT_PATH = __WS_PATH_JSON__;
            window.WS_BACKEND = 'go';
            window.WS_HLS_ENABLED = false;
            {% else %}
            window.CURRENT_PATH = '{{ current_path or "" }}';
            {% endif %}
            // i18n: JavaScript용 번역 객체
            window.T = {{ translations_json|default ('{}') | safe }};
            window.ENABLE_API_LIST_RENDER = {{ 'true' if logged_in else 'false' }};
            window.CURRENT_CAPABILITIES = {{ current_capabilities|default({})|tojson|safe }};
            window.CAN_MODIFY = {{ 'true' if can_modify else 'false' }};
            window.LIST_PAGE_SIZE = {{ list_page_size|default(200) }};
            window.LIST_INITIAL_PAGE = {{ list_page|default(1) }};
            window.LIST_TOTAL_COUNT = {{ list_total_count|default(0) }};
            window.LIST_TOTAL_PAGES = {{ list_total_pages|default(1) }};
            window.LIST_HAS_NEXT = {{ 'true' if list_has_next else 'false' }};
            window.LIST_SORT_BY = '{{ list_sort.by|default("name") if list_sort else "name" }}';
            window.LIST_SORT_ORDER = '{{ list_sort.order|default("asc") if list_sort else "asc" }}';
            window.LIST_QUERY = '{{ list_query|default("") }}';

            document.addEventListener('click', (event) => {
                const parent = event.target.closest('.file-item.parent-folder[data-href]');
                if (parent) {
                    location.href = parent.dataset.href || '/';
                    return;
                }

                const actionTarget = event.target.closest('[data-file-action]');
                if (!actionTarget) return;
                const item = actionTarget.closest('.file-item.data-item');
                if (!item) return;
                const path = item.dataset.path || '';
                const name = item.dataset.name || '';
                const type = item.dataset.type || 'file';
                const ext = item.dataset.ext || '';
                const isDir = item.dataset.isDir === 'true';
                const action = actionTarget.dataset.fileAction;
                if (action) event.stopPropagation();
                if (action === 'toggle-batch') return toggleBatch(actionTarget);
                if (action === 'open') return handleItemClick(path, type, isDir, ext);
                if (action === 'edit') return openEditor(path, name, ext);
                if (action === 'download') return downloadItem(path, isDir);
                if (action === 'delete') return deleteItem(path);
            });

            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter') return;
                const parent = event.target.closest('.file-item.parent-folder[data-href]');
                if (parent) {
                    location.href = parent.dataset.href || '/';
                    return;
                }
                const item = event.target.closest('.file-item.data-item');
                if (!item) return;
                handleItemClick(item.dataset.path || '', item.dataset.type || 'file', item.dataset.isDir === 'true', item.dataset.ext || '');
            });

            document.addEventListener('contextmenu', (event) => {
                const item = event.target.closest('.file-item.data-item');
                if (!item) return;
                let capabilities = {};
                try { capabilities = JSON.parse(item.dataset.capabilities || '{}'); } catch (_) {}
                openCtx(event, item.dataset.path || '', item.dataset.name || '', item.dataset.type || 'file', capabilities);
            });
            {% if go_shell %}

            // Go 셸: 브레드크럼 / 상위 폴더 행 / 현재 폴더 ZIP 링크를 CURRENT_PATH로 구성한다
            // (Python 백엔드는 같은 요소를 Jinja로 서버에서 렌더한다). file_list가 이 스크립트 뒤에
            // 있으므로 DOMContentLoaded에서 실행한다 — app-core.js의 목록 로드 리스너보다 먼저 등록된다.
            document.addEventListener('DOMContentLoaded', function () {
                const path = String(window.CURRENT_PATH || '');
                if (!path) return;
                const parts = path.split('/');
                const enc = (segments) => segments.map(encodeURIComponent).join('/');

                const crumb = document.getElementById('wsBreadcrumb');
                if (crumb) {
                    const home = document.createElement('a');
                    home.href = '/';
                    home.innerHTML = '<i class="fa-solid fa-home"></i>';
                    crumb.appendChild(home);
                    parts.forEach((part, index) => {
                        const sep = document.createElement('span');
                        sep.className = 'separator';
                        sep.textContent = '/';
                        crumb.appendChild(sep);
                        const node = document.createElement(index < parts.length - 1 ? 'a' : 'span');
                        if (index < parts.length - 1) node.href = '/browse/' + enc(parts.slice(0, index + 1));
                        else node.className = 'current';
                        node.textContent = part;
                        crumb.appendChild(node);
                    });
                    crumb.hidden = false;
                }

                const zip = document.getElementById('wsZipLink');
                if (zip) {
                    zip.href = '/zip/' + enc(parts);
                    zip.hidden = false;
                    zip.style.display = 'flex';
                }

                const list = document.getElementById('fileList');
                if (list) {
                    const parentPath = parts.slice(0, -1);
                    const row = document.createElement('li');
                    row.className = 'file-item parent-folder';
                    row.tabIndex = 0;
                    row.setAttribute('role', 'link');
                    row.dataset.href = parentPath.length ? '/browse/' + enc(parentPath) : '/';
                    row.innerHTML = '<div class="file-icon folder"><i class="fa-solid fa-turn-up"></i></div>'
                        + '<div class="file-info"><div class="file-name"></div></div>';
                    row.querySelector('.file-name').textContent = (window.T && window.T.parent_folder) || '.. (상위 폴더)';
                    list.insertBefore(row, list.firstChild);
                }
            });
            {% endif %}
        </script>
