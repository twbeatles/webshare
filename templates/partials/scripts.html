<script>
        const currentPath = window.CURRENT_PATH || "";
        let canModify = !!window.CAN_MODIFY;
        let selectedFiles = new Set();

        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]')?.content || '';
        }

        function jsonHeaders() {
            return {
                'Content-Type': 'application/json',
                'X-CSRF-Token': getCsrfToken()
            };
        }

        const nativeFetch = window.fetch.bind(window);
        window.fetch = function csrfAwareFetch(input, init = {}) {
            const method = String(init.method || (input instanceof Request ? input.method : 'GET') || 'GET').toUpperCase();
            if (!['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
                return nativeFetch(input, init);
            }

            const requestUrl = input instanceof Request ? input.url : String(input);
            const url = new URL(requestUrl, window.location.href);
            if (url.origin !== window.location.origin) {
                return nativeFetch(input, init);
            }

            const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
            if (!headers.has('X-CSRF-Token')) {
                headers.set('X-CSRF-Token', getCsrfToken());
            }

            const nextInit = { ...init, headers };
            if (typeof nextInit.body === 'string' && (headers.get('Content-Type') || '').includes('application/json')) {
                try {
                    const payload = JSON.parse(nextInit.body);
                    if (payload && typeof payload === 'object' && !Array.isArray(payload) && !payload.csrf_token) {
                        nextInit.body = JSON.stringify({ ...payload, csrf_token: getCsrfToken() });
                    }
                } catch (_e) {
                    // Keep the caller's original body if it is not parseable JSON.
                }
            }
            return nativeFetch(input, nextInit);
        };

        function normalizeCapabilities(caps) {
            const source = caps && typeof caps === 'object' ? caps : {};
            return {
                read: !!source.read,
                write: !!source.write,
                delete: !!source.delete,
                rename: !!source.rename,
                move: !!source.move,
                copy: !!source.copy,
                upload: !!source.upload,
                mkdir: !!source.mkdir,
                edit: !!source.edit,
                trash: !!source.trash,
                unzip: !!source.unzip,
            };
        }

        function parseCapabilities(rawCaps) {
            if (!rawCaps) return normalizeCapabilities({});
            if (typeof rawCaps === 'string') {
                try {
                    return normalizeCapabilities(JSON.parse(rawCaps));
                } catch (e) {
                    return normalizeCapabilities({});
                }
            }
            return normalizeCapabilities(rawCaps);
        }

        function applyDirectoryCapabilities(caps) {
            window.CURRENT_CAPABILITIES = normalizeCapabilities(caps);
            canModify = !!(window.CURRENT_CAPABILITIES.write && (window.CURRENT_CAPABILITIES.upload || window.CURRENT_CAPABILITIES.mkdir || window.CURRENT_CAPABILITIES.write));

            const uploadBtn = document.getElementById('uploadBtn');
            const mkdirBtn = document.getElementById('mkdirBtn');
            const fileInput = document.getElementById('fileInput');
            if (uploadBtn) uploadBtn.disabled = !window.CURRENT_CAPABILITIES.upload;
            if (mkdirBtn) mkdirBtn.disabled = !window.CURRENT_CAPABILITIES.mkdir;
            if (fileInput) fileInput.disabled = !window.CURRENT_CAPABILITIES.upload;
        }

        function getItemCapabilities(path) {
            const selector = `.file-item[data-path="${CSS.escape(path || '')}"]`;
            const item = document.querySelector(selector);
            return parseCapabilities(item?.dataset.capabilities || '{}');
        }

        function ensureCapability(allowed, message) {
            if (allowed) return true;
            showToast(message || '권한이 없습니다', 'warning');
            return false;
        }

        // Utility: Format bytes to human readable size
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        // Utility: Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return escapeHtml(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function encodePath(path) {
            return String(path || '').split('/').map(encodeURIComponent).join('/');
        }

        document.addEventListener('click', (event) => {
            const target = event.target.closest('[data-dynamic-action]');
            if (!target) return;
            const action = target.dataset.dynamicAction;
            const path = target.dataset.path || '';
            const name = target.dataset.name || '';
            const tag = target.dataset.tag || '';
            const token = target.dataset.token || '';
            const ip = target.dataset.ip || '';
            if (action === 'remove-bookmark') return removeBookmark(path);
            if (action === 'restore-trash') return restoreFromTrash(name);
            if (action === 'copy-share') {
                navigator.clipboard.writeText(window.location.origin + '/share/' + token);
                return showToast('복사됨', 'success');
            }
            if (action === 'delete-share') return deleteShareLink(token);
            if (action === 'remove-tag') return removeTag(path, tag);
            if (action === 'remove-favorite') return removeFavorite(path);
            if (action === 'unblock-ip') return unblockIp(ip);
            if (action === 'delete-permission') return deletePermission(path);
            if (action === 'open-favorite') return location.href = '/browse/' + encodePath(path);
        });

        // v5: 키보드 탐색 인덱스
        let currentKeyboardIndex = -1;

        // v5: 파일 목록 키보드 탐색
        function navigateFileList(direction) {
            const items = document.querySelectorAll('.file-item.data-item');
            if (items.length === 0) return;

            // 이전 포커스 제거
            if (currentKeyboardIndex >= 0 && items[currentKeyboardIndex]) {
                items[currentKeyboardIndex].classList.remove('keyboard-focused');
            }

            // 새 인덱스 계산
            currentKeyboardIndex += direction;
            if (currentKeyboardIndex < 0) currentKeyboardIndex = items.length - 1;
            if (currentKeyboardIndex >= items.length) currentKeyboardIndex = 0;

            // 새 포커스 적용
            items[currentKeyboardIndex].classList.add('keyboard-focused');
            items[currentKeyboardIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // Utility: Toggle password visibility
        function togglePasswordVisibility() {
            const pwInput = document.getElementById('password');
            const icon = document.getElementById('pwToggleIcon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pwInput.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchDiskInfo();
            document.addEventListener('keydown', (e) => {
                // Escape: 모든 모달 닫기
                if (e.key === "Escape") {
                    document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
                }

                // 입력 필드에 포커스 중이면 단축키 무시
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                // Ctrl+U: 업로드
                if (e.ctrlKey && e.key === 'u' && canModify) {
                    e.preventDefault();
                    document.getElementById('fileInput').click();
                }

                // Ctrl+N: 새 폴더
                if (e.ctrlKey && e.key === 'n' && canModify) {
                    e.preventDefault();
                    openModal('mkdirModal');
                    document.getElementById('newFolderInput').focus();
                }

                // Delete: 선택된 파일 삭제
                if (e.key === 'Delete' && selectedFiles.size > 0 && canModify) {
                    e.preventDefault();
                    batchDelete();
                }

                // Ctrl+A: 모든 파일 선택
                if (e.ctrlKey && e.key === 'a') {
                    e.preventDefault();
                    document.querySelectorAll('.file-check').forEach(c => {
                        if (!c.checked) {
                            c.checked = true;
                            toggleBatch(c);
                        }
                    });
                }

                // F2: 선택된 항목 이름 변경
                if (e.key === 'F2' && selectedFiles.size === 1) {
                    e.preventDefault();
                    const fileName = Array.from(selectedFiles)[0];
                    const newName = prompt("새 이름:", fileName);
                    if (newName && newName !== fileName) {
                        fetch('/rename/' + encodePath(currentPath), {
                            method: 'POST',
                            headers: jsonHeaders(),
                            body: JSON.stringify({ old_name: fileName, new_name: newName, csrf_token: getCsrfToken() })
                        }).then(r => r.json()).then(d => {
                            if (d.success) location.reload();
                            else showToast(d.error, 'error');
                        });
                    }
                }

                // v5: 방향키로 파일 목록 탐색
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateFileList(e.key === 'ArrowDown' ? 1 : -1);
                }

                // v5: Enter로 선택된 항목 열기
                if (e.key === 'Enter' && currentKeyboardIndex >= 0) {
                    e.preventDefault();
                    const items = document.querySelectorAll('.file-item.data-item');
                    if (items[currentKeyboardIndex]) {
                        items[currentKeyboardIndex].querySelector('.file-info').click();
                    }
                }
            });

            // 단축키 힌트 표시
            console.log('📌 키보드 단축키: Ctrl+U(업로드), Ctrl+N(새폴더), Delete(삭제), Ctrl+A(전체선택), F2(이름변경)');
        });

        // v7.0: 드롭다운 메뉴 토글
        function toggleDropdown(id) {
            const dropdown = document.getElementById(id);
            const isOpen = dropdown.classList.contains('open');
            closeDropdowns();
            if (!isOpen) dropdown.classList.add('open');
        }

        function closeDropdowns() {
            document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
        }

        // 드롭다운 외부 클릭 시 닫기
        document.addEventListener('click', e => {
            if (!e.target.closest('.dropdown')) closeDropdowns();
        });

        function fetchStats() {
            fetch('/metrics').then(r => r.json()).then(d => {
                document.getElementById('st_uptime').innerText = d.uptime;
                document.getElementById('st_req').innerText = d.requests.toLocaleString();
                document.getElementById('st_sent').innerText = d.sent;
                document.getElementById('st_recv').innerText = d.recv;
            });
        }

        // v7.2.4: 언어 전환
        function toggleLanguage() {
            const currentLang = document.documentElement.lang || 'ko';
            const newLang = currentLang === 'ko' ? 'en' : 'ko';
            const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

            fetch('/set_language', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken
                },
                body: JSON.stringify({ lang: newLang, csrf_token: csrfToken })
            })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        document.documentElement.lang = newLang;
                        showToast(newLang === 'en' ? 'Language changed to English' : '언어가 한국어로 변경되었습니다', 'success');
                        // 페이지 새로고침하여 번역 적용
                        setTimeout(() => location.reload(), 500);
                    } else {
                        showToast('언어 변경 실패', 'error');
                    }
                })
                .catch(e => showToast('언어 변경 오류: ' + e.message, 'error'));
        }

        // v7.2.4: 테마 전환
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'light';
            const newTheme = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            // 아이콘 업데이트
            const icon = document.querySelector('[data-tooltip="테마 변경"] i');
            if (icon) {
                icon.className = newTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }

            showToast(newTheme === 'dark' ? '다크 모드 활성화' : '라이트 모드 활성화', 'info');
        }

        // 페이지 로드 시 저장된 테마 적용
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                const icon = document.querySelector('[data-tooltip="테마 변경"] i');
                if (icon) {
                    icon.className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
                }
            }
        })();

        // v7.2.4: 시스템 모니터링
        function loadSystemStats() {
            const container = document.getElementById('systemStatsContent');
            if (!container) return;

            container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;"></i><p>로딩 중...</p></div>';

            Promise.all([
                fetch('/metrics').then(r => r.json()).catch(e => ({})),
                fetch('/disk_info').then(r => r.json()).catch(e => ({})),
                fetch('/disk_status').then(r => r.json()).catch(e => ({}))
            ]).then(([metrics, diskInfo, diskStatus]) => {
                const formatBytes = (b) => {
                    if (b < 1024) return b + ' B';
                    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
                    if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
                    return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
                };

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">서버 가동시간</div>
                            <div class="stat-value">${metrics.uptime || 'N/A'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">총 요청수</div>
                            <div class="stat-value">${metrics.requests?.toLocaleString() || 0}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">전송된 데이터</div>
                            <div class="stat-value">${metrics.sent || '0 B'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">수신된 데이터</div>
                            <div class="stat-value">${metrics.recv || '0 B'}</div>
                        </div>
                    </div>
                    <div class="admin-section" style="margin-top:20px;">
                        <h4><i class="fa-solid fa-hard-drive"></i> 디스크 사용량</h4>
                        <p><strong>사용:</strong> ${diskInfo.used_fmt || 'N/A'} / ${diskInfo.total_fmt || 'N/A'} (${diskInfo.percent || 0}%)</p>
                        <div class="disk-bar">
                            <div class="disk-fill" style="width:${diskInfo.percent || 0}%; background:${(diskInfo.percent || 0) > 90 ? 'var(--danger)' : (diskInfo.percent || 0) > 70 ? 'var(--warning)' : 'var(--success)'}"></div>
                        </div>
                        <p style="margin-top:10px;"><strong>여유 공간:</strong> ${diskInfo.free_fmt || 'N/A'}</p>
                    </div>
                    ${diskStatus.warning ? `<div style="padding:12px; background:var(--danger-light); color:var(--danger); border-radius:8px; margin-top:15px;"><i class="fa-solid fa-triangle-exclamation"></i> ${diskStatus.message}</div>` : ''}
                `;
            }).catch(e => {
                container.innerHTML = '<div style="text-align:center; color:var(--danger);"><i class="fa-solid fa-circle-exclamation"></i> 시스템 정보를 불러올 수 없습니다.</div>';
            });
        }

        function toggleBatch(checkbox) {
            const row = checkbox.closest('.file-item');
            if (checkbox.checked) {
                selectedFiles.add(checkbox.value);
                row.classList.add('selected');
            } else {
                selectedFiles.delete(checkbox.value);
                row.classList.remove('selected');
            }
            updateBatchUI();
        }

        function updateBatchUI() {
            const bar = document.getElementById('batchBar');
            const cnt = document.getElementById('batchCount');
            if (selectedFiles.size > 0) {
                bar.style.display = 'flex';
                cnt.innerText = selectedFiles.size + (T.items_selected || '개 선택됨');
            } else {
                bar.style.display = 'none';
            }
        }

        function batchDownload() {
            if (selectedFiles.size === 0) return;
            const files = Array.from(selectedFiles);
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/batch_download/' + encodePath(currentPath);
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'files';
            input.value = JSON.stringify(files);
            form.appendChild(input);
            // CSRF 토큰 추가
            const csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = 'csrf_token';
            csrfInput.value = document.querySelector('meta[name="csrf-token"]').content;
            form.appendChild(csrfInput);
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            document.querySelectorAll('.file-check').forEach(c => { c.checked = false; toggleBatch(c); });
        }

        function batchDelete() {
            if (selectedFiles.size === 0) return;
            const confirmMsg = selectedFiles.size + (T.confirm_delete_multiple || '개 항목을 삭제하시겠습니까?');
            if (!confirm(confirmMsg)) return;
            fetch('/batch_delete/' + encodePath(currentPath), {
                method: 'POST',
                headers: jsonHeaders(),
                body: JSON.stringify({ files: Array.from(selectedFiles), csrf_token: getCsrfToken() })
            }).then(r => r.json()).then(d => {
                if (d.success) location.reload(); else alert(d.error);
            });
        }

        let editPath = '';
        let isMarkdown = false;

        function handleItemClick(path, type, isDir, ext) {
            if (isDir) location.href = '/browse/' + path;
            // v6.0: 비디오는 스트리밍 플레이어로 재생
            else if (type === 'video') {
                playVideo(path);
            }
            // v6.0: 오디오는 현재 폴더 플레이리스트로 재생 (단일 파일은 기존 방식)
            else if (type === 'audio') {
                openEditor(path, path.split('/').pop(), ext, true);
            }
            else if (type === 'image' || ext.toLowerCase() === '.pdf') {
                openEditor(path, path.split('/').pop(), ext, true);
            }
            else if (type === 'text') {
                openEditor(path, path.split('/').pop(), ext, false);
            }
            // v7.0: 문서 미리보기 (Word, Excel, PowerPoint, CSV, JSON)
            else if (['.docx', '.xlsx', '.xls', '.pptx', '.csv', '.json'].includes(ext.toLowerCase())) {
                openDocumentPreview(path, path.split('/').pop());
            }
            else location.href = '/download/' + encodePath(path);
        }

        function openEditor(path, name, ext, readOnly) {
            editPath = path;
            ext = ext.toLowerCase();
            isMarkdown = ext === '.md';

            document.getElementById('editorTitle').innerText = name;

            const editor = document.getElementById('editorContent');
            const preview = document.getElementById('codePreview');
            const media = document.getElementById('mediaContainer');
            const saveBtn = document.getElementById('saveBtn');
            const toggleBtn = document.getElementById('previewToggle');

            editor.style.display = 'none';
            preview.style.display = 'none';
            media.style.display = 'none';
            toggleBtn.style.display = 'none';
            saveBtn.style.display = readOnly ? 'none' : 'inline-block';

            if (readOnly) {
                media.style.display = 'flex';
                const url = '/download/' + encodePath(path);
                if (ext === '.pdf') {
                    media.innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;" title="PDF Preview"></iframe>`;
                } else if (['.mp4', '.webm', '.ogg', '.mkv', '.avi', '.mov', '.wmv', '.flv'].includes(ext)) {
                    // v7.2.3: HLS Support
                    if (['.mkv', '.avi', '.mov', '.wmv', '.flv'].includes(ext)) {
                        media.innerHTML = `
                             <video id="hls-player" controls style="max-width:100%; max-height:100%; width:100%;"></video>
                         `;
                        setTimeout(() => {
                            const video = document.getElementById('hls-player');
                            if (Hls.isSupported()) {
                                const hls = new Hls();
                                hls.loadSource('/stream/hls/' + encodePath(path) + '/index.m3u8');
                                hls.attachMedia(video);
                            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                video.src = '/stream/hls/' + encodePath(path) + '/index.m3u8';
                            } else {
                                media.innerHTML = '<p class="error">이 브라우저는 HLS 재생을 지원하지 않습니다.</p>';
                            }
                        }, 100);
                    } else {
                        media.innerHTML = `<video controls autoplay style="max-width:100%; max-height:100%"><source src="${url}"></video>`;
                    }
                } else if (['.mp3', '.wav', '.ogg'].includes(ext)) {
                    media.innerHTML = `<audio controls autoplay><source src="${url}"></audio>`;
                } else if (['.jpg', '.jpeg', '.png', '.gif', '.webp'].includes(ext)) {
                    media.innerHTML = `<img src="${url}" style="max-width:100%; max-height:100%; object-fit:contain">`;
                }
                openModal('editorModal');
            } else {
                editor.style.display = 'block';
                toggleBtn.style.display = 'inline-block';
                toggleBtn.innerText = "미리보기";
                editor.value = "Loading...";

                fetch('/get_content/' + encodePath(path)).then(r => r.json().then(d => ({ status: r.status, body: d }))).then(({ status, body: d }) => {
                    if (d.error) {
                        if (status === 413) {
                            showToast(d.error || '파일이 너무 커서 편집할 수 없습니다.', 'error');
                        } else {
                            alert(d.error);
                        }
                        return;
                    }
                    editor.value = d.content;
                    openModal('editorModal');
                });
            }
        }

        function toggleMarkdownPreview() {
            const editor = document.getElementById('editorContent');
            const preview = document.getElementById('codePreview');
            const btn = document.getElementById('previewToggle');

            if (editor.style.display !== 'none') {
                if (isMarkdown) {
                    preview.innerHTML = typeof window.wsRenderMarkdownHtml === 'function'
                        ? window.wsRenderMarkdownHtml(editor.value)
                        : escapeHtml(editor.value);
                } else {
                    const safeContent = editor.value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    const ext = editPath.split('.').pop();
                    preview.innerHTML = `<pre><code class="language-${ext}">${safeContent}</code></pre>`;
                    hljs.highlightElement(preview.querySelector('code'));
                }
                editor.style.display = 'none';
                preview.style.display = 'block';
                btn.innerText = "편집하기";
            } else {
                preview.style.display = 'none';
                editor.style.display = 'block';
                btn.innerText = "미리보기";
            }
        }

        function saveFileContent() {
            const content = document.getElementById('editorContent').value;
            fetch('/save_content/' + encodeURIComponent(editPath), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            }).then(r => r.json().then(d => ({ status: r.status, body: d }))).then(({ status, body: d }) => {
                if (d.success) { showToast('저장되었습니다.'); closeModal('editorModal'); }
                else {
                    if (status === 413) {
                        showToast(d.error || '저장할 내용이 너무 큽니다.', 'error');
                    } else {
                        alert(d.error);

        function uploadFiles(files) {
            if (!ensureCapability(window.CURRENT_CAPABILITIES.upload, '이 폴더에는 업로드 권한이 없습니다')) return;
            openModal('progressModal');
            const fd = new FormData();
            let totalSize = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const path = file.webkitRelativePath || file.name;
                fd.append('file', file);
                fd.append('paths', path);
                totalSize += file.size;
            }

            // 파일 정보 표시 (전역 formatSize 함수 사용)
            document.getElementById('progressFileInfo').innerText =
                `${files.length}개 파일 (${formatSize(totalSize)})`;

            const xhr = new XMLHttpRequest();
            const startTime = Date.now();

            xhr.open('POST', '/upload/' + encodePath(currentPath));
            // v7.1: CSRF Token for XHR
            xhr.setRequestHeader('X-CSRF-Token', document.querySelector('meta[name="csrf-token"]').content);

            xhr.upload.onprogress = e => {
                if (e.lengthComputable) {
                    const p = Math.round((e.loaded / e.total) * 100);
                    const elapsed = (Date.now() - startTime) / 1000;
                    const speed = e.loaded / elapsed;
                    const remaining = (e.total - e.loaded) / speed;

                    document.getElementById('progressBar').style.width = p + '%';
                    document.getElementById('progressBar').setAttribute('aria-valuenow', p);
                    document.getElementById('progressText').innerText = p + '%';

                    // 속도와 예상 시간 표시
                    const speedStr = formatSize(speed) + '/s';
                    const remainStr = remaining > 60
                        ? Math.ceil(remaining / 60) + '분 남음'
                        : Math.ceil(remaining) + '초 남음';
                    document.getElementById('progressStats').innerText =
                        `${speedStr} • ${formatSize(e.loaded)} / ${formatSize(e.total)} • ${remainStr}`;
                }
            };
            xhr.onload = () => {
                showToast('업로드 완료!', 'success');
                setTimeout(() => location.reload(), 500);
            };
            xhr.onerror = () => {
                showToast('업로드 실패', 'error');
                closeModal('progressModal');
            };
            xhr.send(fd);
        }

                warning: '<i class="fa-solid fa-exclamation-triangle"></i>',

            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML = (icons[type] || '') + ' ' + msg;

        function sortFiles() {
            const list = document.getElementById('fileList');
            const items = Array.from(list.querySelectorAll('.data-item'));
            const type = document.getElementById('sortOrder').value;
            const parent = list.querySelector('.parent-folder');
            items.sort((a, b) => {
                const isDirA = a.querySelector('.file-icon').classList.contains('folder');
                const isDirB = b.querySelector('.file-icon').classList.contains('folder');
                if (isDirA !== isDirB) return isDirA ? -1 : 1;
                if (type === 'name') return a.getAttribute('data-name').localeCompare(b.getAttribute('data-name'));
                if (type === 'size') return parseInt(b.getAttribute('data-size')) - parseInt(a.getAttribute('data-size'));
                if (type === 'date') return parseFloat(b.getAttribute('data-date')) - parseFloat(a.getAttribute('data-date'));
                return 0;
            });
            list.innerHTML = '';
            if (parent) list.appendChild(parent);
            items.forEach(item => list.appendChild(item));

                }
            }
            if (action === 'info') {
                showFileInfo(ctxTarget.path);
            }
            if (action === 'bookmark') {
                addBookmark(ctxTarget.path, ctxTarget.name);
            }
            if (action === 'share') {
                openShareModal(ctxTarget.path);
            }
            if (action === 'trash') {
                if (!ensureCapability(ctxTarget.capabilities.trash, '이 항목을 휴지통으로 이동할 권한이 없습니다')) return;
                if (!confirm('휴지통으로 이동하시겠습니까?')) return;

            // v7.0: 암호화
            if (action === 'encrypt') {
                document.getElementById('encryptTargetPath').textContent = '대상: ' + ctxTarget.name;
                document.getElementById('encryptPassword').value = '';
                openModal('encryptModal');

            // v7.0: 복호화

                document.getElementById('decryptTargetPath').textContent = '대상: ' + ctxTarget.name;
                document.getElementById('decryptPassword').value = '';
                openModal('decryptModal');
            }

        // v5.1: 드래그앤드롭 파일 이동
        function initFileDragDrop() {
            document.querySelectorAll('.file-item.data-item').forEach(item => {
                // 파일은 드래그 가능
                if (!item.querySelector('.fa-folder')) {
                    item.setAttribute('draggable', 'true');
                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', item.getAttribute('data-name'));
                        e.dataTransfer.effectAllowed = 'move';
                        item.style.opacity = '0.5';
                    });
                    item.addEventListener('dragend', () => {
                        item.style.opacity = '1';
                    });
                }

                // 폴더는 드롭 대상
                if (item.querySelector('.fa-folder')) {
                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        item.style.background = 'var(--primary)';
                        item.style.opacity = '0.8';
                    });
                    item.addEventListener('dragleave', () => {
                        item.style.background = '';
                        item.style.opacity = '1';
                    });
                    item.addEventListener('drop', (e) => {
                        e.preventDefault();
                        item.style.background = '';
                        item.style.opacity = '1';
                        const sourceFile = e.dataTransfer.getData('text/plain');
                        const destFolder = item.getAttribute('data-name');
                        if (sourceFile && destFolder && canModify) {
                            const srcPath = currentPath ? currentPath + '/' + sourceFile : sourceFile;
                            const dstPath = (currentPath ? currentPath + '/' : '') + destFolder + '/' + sourceFile.split('/').pop();
                            fetch('/move', {
                                method: 'POST',
                                headers: jsonHeaders(),
                                body: JSON.stringify({ source: srcPath, destination: dstPath, csrf_token: getCsrfToken() })
                            }).then(r => r.json()).then(d => {
                                if (d.success) {
                                    showToast(`${sourceFile} → ${destFolder}로 이동됨`, 'success');
                                    location.reload();
                                } else {
                                    showToast(d.error || '이동 실패', 'error');
                                }
                            });
                        }
                    });
                }
            });
        }

            const list = document.getElementById('audioPlaylist');
            list.innerHTML = audioTracks.map((t, i) => `

                    padding:12px 15px; cursor:pointer; display:flex; align-items:center; gap:10px;

                </div>
            `).join('');

        function playAudioTrack(index) {
            if (index < 0 || index >= audioTracks.length) return;
            currentTrackIndex = index;
            const track = audioTracks[index];
            const audio = document.getElementById('audioPlayer');
            audio.src = track.stream_url;
            audio.play();
            document.getElementById('audioNowPlaying').textContent = track.name;
            renderAudioPlaylist();
        }

        function audioPlayPrev() {
            playAudioTrack((currentTrackIndex - 1 + audioTracks.length) % audioTracks.length);
        }

        function audioPlayNext() {
            playAudioTrack((currentTrackIndex + 1) % audioTracks.length);
        }

        // ==========================================
        // v6.0: 청크 업로드
        // ==========================================
        async function uploadLargeFile(file, targetPath) {
            const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

            // 세션 시작
            const initRes = await fetch('/upload/chunk/init', {
                method: 'POST',
                headers: jsonHeaders(),
                body: JSON.stringify({
                    filename: file.name,
                    total_size: file.size,
                    path: targetPath,
                    chunk_size: CHUNK_SIZE,
                    total_chunks: totalChunks,
                    csrf_token: getCsrfToken()
                })
            }).then(r => r.json());

            if (!initRes.success) {
                showToast('업로드 시작 실패: ' + initRes.error, 'error');
                return false;
            }

            const sessionId = initRes.session_id;

            // 청크 업로드
            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);

                const formData = new FormData();
                formData.append('index', i);
                formData.append('chunk', chunk);

                const chunkRes = await fetch('/upload/chunk/' + sessionId, {
                    method: 'POST',
                    headers: { 'X-CSRF-Token': getCsrfToken() },
                    body: formData
                }).then(r => r.json());

                if (!chunkRes.success) {
                    showToast('청크 업로드 실패', 'error');
                    await fetch('/upload/chunk/' + sessionId + '/cancel', {
                        method: 'POST',
                        headers: jsonHeaders(),
                        body: JSON.stringify({ csrf_token: getCsrfToken() })
                    });
                    return false;
                }

                // 진행률 업데이트
                const progress = Math.round(((i + 1) / totalChunks) * 100);
                document.getElementById('uploadProgressText').textContent = `${file.name}: ${progress}%`;
                document.getElementById('uploadProgressBar').style.width = progress + '%';
            }

            // 완료
            const completeRes = await fetch('/upload/chunk/' + sessionId + '/complete', {
                method: 'POST',
                headers: jsonHeaders(),
                body: JSON.stringify({ csrf_token: getCsrfToken() })
            }).then(r => r.json());

            if (completeRes.success) {
                showToast(`${file.name} 업로드 완료`, 'success');
                return true;
            } else {
                showToast('파일 병합 실패: ' + completeRes.error, 'error');
                return false;
            }
        }

        // ==========================================
        // v7.2: 키보드 단축키
        // ==========================================
        let selectedFileIndex = -1;
        let clipboardFiles = [];
        let clipboardAction = null; // 'copy' or 'cut'

        const KEYBOARD_SHORTCUTS = {
            '?': () => openModal('shortcutsModal'),
            'ArrowUp': () => selectFileByIndex(selectedFileIndex - 1),
            'ArrowDown': () => selectFileByIndex(selectedFileIndex + 1),
            'Enter': () => openSelectedFile(),
            'Delete': () => deleteSelectedItems(),
            'F2': () => renameSelectedItem(),
            'Escape': () => { closeAllModals(); clearSelection(); },
            'g': () => toggleView(),
            'd': () => toggleDarkMode(),
        };

        const CTRL_SHORTCUTS = {
            'a': (e) => { e.preventDefault(); selectAllItems(); },
            'c': () => copySelectedItems(),
            'x': () => cutSelectedItems(),
            'v': () => pasteItems(),
            'n': (e) => { e.preventDefault(); if (window.CURRENT_CAPABILITIES.mkdir) openModal('mkdirModal'); },
            'u': (e) => { e.preventDefault(); if (window.CURRENT_CAPABILITIES.upload) document.getElementById('fileInput')?.click(); },
            'f': (e) => { e.preventDefault(); document.querySelector('.search-box input')?.focus(); },
            't': (e) => { e.preventDefault(); createNewTab(); },
        };

        document.addEventListener('keydown', (e) => {
            // 입력 필드에서는 단축키 비활성화
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

            const key = e.key.toLowerCase();

            if (e.ctrlKey || e.metaKey) {
                if (CTRL_SHORTCUTS[key]) {
                    CTRL_SHORTCUTS[key](e);
                    return;
                }
            }

            if (KEYBOARD_SHORTCUTS[e.key]) {
                KEYBOARD_SHORTCUTS[e.key]();
            }
        });

            const items = document.querySelectorAll('.file-item');

            index = Math.max(0, Math.min(index, items.length - 1));
            items.forEach((item, i) => item.classList.remove('selected'));
            items[index]?.classList.add('selected');
            items[index]?.scrollIntoView({ block: 'nearest' });
            selectedFileIndex = index;
        }

                    if (path && confirm('삭제하시겠습니까?')) {

            const selected = document.querySelector('.file-item.selected');
            if (selected && selected.dataset.name) {
                const caps = parseCapabilities(selected.dataset.capabilities || '{}');
                if (!ensureCapability(caps.rename, '이 항목의 이름을 변경할 권한이 없습니다')) return;
                const newName = prompt('새 이름:', selected.dataset.name);
                if (newName && newName !== selected.dataset.name) {

                        method: 'POST',
                        headers: jsonHeaders(),
                        body: JSON.stringify({ old_name: selected.dataset.name, new_name: newName, csrf_token: getCsrfToken() })
                    }).then(() => location.reload());

        function cutSelectedItems() {

        function pasteItems() {
            if (clipboardFiles.length === 0) return;
            if (!ensureCapability(window.CURRENT_CAPABILITIES.write, '현재 폴더에 붙여넣기 권한이 없습니다')) return;

            const action = clipboardAction === 'cut' ? 'move' : 'copy';
            let completed = 0;

            clipboardFiles.forEach(file => {
                fetch('/' + action, {
                    method: 'POST',
                    headers: jsonHeaders(),
                    body: JSON.stringify({
                        source: file,
                        destination: CURRENT_PATH + '/' + file.split('/').pop(),
                        csrf_token: getCsrfToken()
                    })
                }).then(() => {
                    completed++;
                    if (completed === clipboardFiles.length) {
                        showToast(`${completed}개 항목 붙여넣기 완료`, 'success');
                        if (clipboardAction === 'cut') clipboardFiles = [];

        function getSelectedFiles() {
            const files = [];
            document.querySelectorAll('.file-check:checked').forEach(cb => {

        // ==========================================
        // v7.2: 드래그 앤 드롭 이동
        // ==========================================
        let draggedItem = null;

        function initDragDrop() {
            document.querySelectorAll('.file-item').forEach(item => {
                item.setAttribute('draggable', 'true');

                item.addEventListener('dragstart', (e) => {
                    draggedItem = item;
                    item.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', item.dataset.path || '');
                    e.dataTransfer.effectAllowed = 'move';
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    document.querySelectorAll('.file-item').forEach(i => i.classList.remove('drop-target'));
                    draggedItem = null;
                });

                // 폴더에만 드롭 허용
                if (item.dataset.isDir === 'true') {
                    item.addEventListener('dragover', (e) => {
                        if (draggedItem && draggedItem !== item) {
                            e.preventDefault();
                            e.dataTransfer.dropEffect = 'move';
                            item.classList.add('drop-target');
                        }
                    });

                    item.addEventListener('dragleave', () => {
                        item.classList.remove('drop-target');
                    });

                    item.addEventListener('drop', (e) => {
                        e.preventDefault();
                        item.classList.remove('drop-target');

                        if (!draggedItem) return;

                        const sourcePath = draggedItem.dataset.path;
                        const targetFolder = item.dataset.path;
                        const fileName = sourcePath.split('/').pop();

                        fetch('/move', {
                            method: 'POST',
                            headers: jsonHeaders(),
                            body: JSON.stringify({
                                source: sourcePath,
                                destination: targetFolder + '/' + fileName,
                                csrf_token: getCsrfToken()
                            })
                        }).then(r => r.json()).then(d => {
                            if (d.success) {
                                showToast(`${fileName} 이동 완료`, 'success');
                                location.reload();
                            } else {
                                showToast(d.error || '이동 실패', 'error');
                            }
                        });
                    });
                }
            });
        }

        // ==========================================
        // v7.2: 다중 탭 지원
        // ==========================================
        // ==========================================
        // v7.2: 다중 탭 지원 (SessionStorage 기반)
        // ==========================================
        let tabs = [];
        let activeTabId = 0;

        function initTabs() {
            try {
                const storedTabs = sessionStorage.getItem('webshare_tabs');
                const storedActiveId = sessionStorage.getItem('webshare_active_tab');

                if (storedTabs && storedActiveId) {
                    tabs = JSON.parse(storedTabs);
                    activeTabId = parseInt(storedActiveId);

                    // 현재 활성 탭의 경로를 실제 현재 페이지 경로로 업데이트
                    const activeTab = tabs.find(t => t.id === activeTabId);
                    if (activeTab) {
                        activeTab.path = CURRENT_PATH;
                        activeTab.title = CURRENT_PATH ? CURRENT_PATH.split('/').pop() : '홈';
                        saveTabs();
                    } else {
                        // 활성 탭을 찾을 수 없으면 초기화
                        resetTabs();
                    }
                } else {
                    resetTabs();
                }
            } catch (e) {
                console.error("Tab initialization failed", e);
                resetTabs();
            }
            renderTabs();
        }

        function resetTabs() {
            tabs = [{ id: Date.now(), path: CURRENT_PATH, title: CURRENT_PATH ? CURRENT_PATH.split('/').pop() : '홈' }];
            activeTabId = tabs[0].id;
            saveTabs();
        }

        function saveTabs() {
            sessionStorage.setItem('webshare_tabs', JSON.stringify(tabs));
            sessionStorage.setItem('webshare_active_tab', activeTabId);
        }

        function createNewTab(path = '') {
            const newTab = {
                id: Date.now(),
                path: path,
                title: path ? path.split('/').pop() || '루트' : '새 탭'
            };
            tabs.push(newTab);
            saveTabs();
            switchTab(newTab.id);
        }

        function closeTab(tabId) {
            if (tabs.length <= 1) return;

            const index = tabs.findIndex(t => t.id === tabId);
            if (index === -1) return;

            tabs.splice(index, 1);

            // 닫은 탭이 활성 탭이었다면 다른 탭으로 전환
            if (activeTabId === tabId) {
                const newActiveTab = tabs[Math.min(index, tabs.length - 1)];
                switchTab(newActiveTab.id);
            } else {
                saveTabs();
                renderTabs();
            }
        }

        function switchTab(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            if (tab) {
                activeTabId = tabId;
                saveTabs();
                // 경로가 다르면 이동, 같으면 렌더링만 (새로고침 방지)
                if (tab.path !== CURRENT_PATH && tab.path !== undefined) {
                    window.location.href = tab.path ? '/browse/' + tab.path : '/';
                } else {
                    renderTabs();
                }
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabBar');
            if (!container) return;

            container.innerHTML = tabs.map(tab => `
                <div class="tab ${tab.id === activeTabId ? 'active' : ''}" onclick="switchTab(${tab.id})">
                    <span class="tab-title">${escapeHtml(tab.title || '홈')}</span>
                    ${tabs.length > 1 ? `<button class="tab-close" onclick="event.stopPropagation(); closeTab(${tab.id})">×</button>` : ''}
                </div>
            `).join('') + '<button id="newTabBtn" onclick="createNewTab()">+</button>';
        }

        // 페이지 로드 시 탭 초기화 실행
        document.addEventListener('DOMContentLoaded', initTabs);

        // ==========================================
        // v7.2: PDF 미리보기
        // ==========================================
        async function previewPDF(path) {
            openModal('pdfPreviewModal');
            const viewer = document.getElementById('pdfViewer');
            viewer.innerHTML = '<p style="text-align:center; padding:40px;">PDF 로딩 중...</p>';

            try {
                // PDF.js 사용
                if (typeof pdfjsLib === 'undefined') {
                    viewer.innerHTML = '<iframe src="/download/' + path + '" style="width:100%; height:100%; border:none;"></iframe>';
                    return;
                }

                const pdf = await pdfjsLib.getDocument('/download/' + path).promise;
                viewer.innerHTML = '';

                for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
                    const page = await pdf.getPage(i);
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.display = 'block';
                    canvas.style.margin = '10px auto';
                    viewer.appendChild(canvas);

                    await page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport
                    }).promise;
                }

                if (pdf.numPages > 10) {
                    viewer.innerHTML += '<p style="text-align:center;">... 더 많은 페이지가 있습니다. 전체 보기는 다운로드하세요.</p>';
                }
            } catch (e) {
                viewer.innerHTML = '<p style="color:var(--danger); text-align:center; padding:40px;">PDF 로드 실패: ' + e.message + '</p>';
            }
        }

        function previewMarkdown(path) {
            fetch('/get_content/' + encodePath(path)).then(r => r.json()).then(d => {
                if (d.error) {
                    showToast(d.error, 'error');
                    return;
                }

                openModal('editorModal');
                document.getElementById('editorModalTitle').textContent = path.split('/').pop();

                const preview = document.getElementById('markdownPreview');
                const editor = document.getElementById('editorArea');

                if (preview) {
                    preview.innerHTML = typeof window.wsRenderMarkdownHtml === 'function'
                        ? window.wsRenderMarkdownHtml(d.content)
                        : escapeHtml(d.content);
                    // 코드 하이라이팅
                    preview.querySelectorAll('pre code').forEach(block => {
                        if (typeof hljs !== 'undefined') hljs.highlightElement(block);
                    });
                }

                if (editor) {
                    editor.value = d.content;
                }
            });
        }

        // ==========================================
        // v7.2: 관리자 기능 - 중복 파일 검사
        // ==========================================
        let duplicatePollTimer = null;

        function openDuplicatesModal() {
            openModal('duplicatesModal');
            checkDuplicateStatus();
        }

        function startDuplicateScan() {
            fetch('/api/duplicates/scan', {
                method: 'POST',
                headers: jsonHeaders(),
                body: JSON.stringify({ min_size: 1024, csrf_token: getCsrfToken() })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    showToast('중복 파일 스캔 시작', 'info');
                    if (d.job_id) {
                        document.getElementById('duplicateProgress').textContent = `준비 중... job ${d.job_id}`;
                    }
                    pollDuplicateProgress();
                } else {
                    showToast(d.error || '스캔 실패', 'error');
                }
            });
        }

        function cancelDuplicateScan() {
            fetch('/api/duplicates/cancel', {
                method: 'POST',
                headers: jsonHeaders(),
                body: JSON.stringify({ csrf_token: getCsrfToken() })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    showToast('중복 파일 스캔 취소 요청됨', 'warning');
                } else {
                    showToast(d.error || '취소 실패', 'error');
                }
            });
        }

        function pollDuplicateProgress() {
            if (duplicatePollTimer) return;

            const tick = () => {
                fetch('/api/duplicates').then(r => r.json()).then(d => {
                    const progress = document.getElementById('duplicateProgress');
                    if (progress) {
                        if (d.running) {
                            progress.textContent = `스캔 중... ${d.phase || 'running'} · ${d.progress}/${d.total}`;
                        } else if (d.cancelled) {
                            progress.textContent = `취소됨: ${d.phase || 'cancelled'}`;
                        } else {
                            progress.textContent = `완료: ${d.results.length}개 중복 그룹 발견`;
                        }
                    }

                    if (!d.running) {
                        clearInterval(duplicatePollTimer);
                        duplicatePollTimer = null;
                        renderDuplicates(d.results);
                        if (d.cancelled) {
                            showToast('중복 파일 스캔이 취소되었습니다', 'warning');
                        }
                    }
                });
            };

            tick();
            duplicatePollTimer = setInterval(tick, 1000);
        }

        function checkDuplicateStatus() {
            fetch('/api/duplicates').then(r => r.json()).then(d => {
                if (d.running) {
                    pollDuplicateProgress();
                } else {
                    const progress = document.getElementById('duplicateProgress');
                    if (progress) {
                        if (d.cancelled) {
                            progress.textContent = `취소됨: ${d.phase || 'cancelled'}`;
                        } else if (d.results.length > 0) {
                            progress.textContent = `완료: ${d.results.length}개 중복 그룹 발견`;
                        } else {
                            progress.textContent = '';
                        }
                    }
                    if (d.results.length > 0) {
                        renderDuplicates(d.results);
                    }
                }
            });
        }

        function renderDuplicates(groups) {
            const container = document.getElementById('duplicatesList');
            if (!container) return;

            if (groups.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.6; padding:20px;">중복 파일이 없습니다</p>';
                return;
            }

            container.innerHTML = groups.map((group, gi) => {
                const files = Array.isArray(group) ? group : (group.files || []);
                const eachSize = (group && group.size) || (files[0] ? files[0].size : 0);
                const hashLabel = group && group.hash ? ` · ${group.hash.slice(0, 8)}...` : '';
                return `
                    <div style="margin-bottom:16px; padding:12px; background:var(--hover); border-radius:8px;">
                        <div style="font-weight:500; margin-bottom:8px;">그룹 ${gi + 1} (${files.length}개 파일, 각 ${formatBytes(eachSize)})${hashLabel}</div>
                        ${files.map((file, fi) => `
                            <div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
                                <input type="checkbox" class="duplicate-check" data-path="${escapeAttr(file.path)}" ${fi > 0 ? 'checked' : ''}>
                                <span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(file.path)}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');
        }

        function deleteSelectedDuplicates() {
            const files = [];
            document.querySelectorAll('.duplicate-check:checked').forEach(cb => {
                files.push(cb.dataset.path);
            });

            if (files.length === 0) {
                showToast('삭제할 파일을 선택하세요', 'warning');
                return;
            }

            if (!confirm(`${files.length}개 파일을 삭제하시겠습니까?`)) return;

            fetch('/api/duplicates/delete', {
                method: 'POST',
                headers: jsonHeaders(),
                body: JSON.stringify({ files, csrf_token: getCsrfToken() })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    showToast(`${d.deleted}개 파일 삭제됨`, 'success');
                    startDuplicateScan(); // 다시 스캔
                }
            });
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ==========================================
        // v7.2: 관리자 기능 - 폴더 권한
        // ==========================================
        function openPermissionsModal() {
            openModal('permissionsModal');
            loadPermissions();
        }

        function loadPermissions() {
            fetch('/api/permissions').then(r => r.json()).then(d => {
                const container = document.getElementById('permissionsList');
                if (!container) return;

                const perms = Object.entries(d.permissions || {});
                if (perms.length === 0) {
                    container.innerHTML = '<p style="text-align:center; opacity:0.6; padding:20px;">설정된 권한이 없습니다</p>';

        function addPermission() {
            const path = prompt('폴더 경로 (예: documents/private):');
            if (!path) return;
            const parsePermissionUsers = (value, fallback) => {
                const raw = value === null ? fallback : value;
                return String(raw || '')
                    .split(',')
                    .map(item => item.trim())
                    .filter(Boolean);
            };
            const read = parsePermissionUsers(prompt('읽기 허용 대상 (*, admin, guest / 쉼표 구분)', '*'), '*');
            const write = parsePermissionUsers(prompt('쓰기 허용 대상 (admin, guest / 빈 값은 명시적 거부)', 'admin'), 'admin');
            const deleteUsers = parsePermissionUsers(prompt('삭제 허용 대상 (admin, guest / 빈 값은 명시적 거부)', 'admin'), 'admin');

            fetch('/api/permissions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    path: path,
                    read: read,
                    write: write,
                    delete: deleteUsers
                })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    showToast('권한 설정 완료', 'success');
                    loadPermissions();
                } else {
                    showToast(d.error || '설정 실패', 'error');
                }
            });
        }

        function deletePermission(path) {
            if (!confirm(`'${path}' 폴더의 권한 설정을 삭제하시겠습니까?`)) return;

            const encodedPath = path.split('/').map(encodeURIComponent).join('/');
            fetch('/api/permissions/' + encodedPath, { method: 'DELETE' })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        showToast('권한 삭제됨', 'success');
                        loadPermissions();

        function pollCloudJob(jobId) {
            const poll = () => {
                fetch('/api/cloud/jobs/' + encodeURIComponent(jobId))
                    .then(r => r.json())
                    .then(d => {
                        if (!d.success || !d.job) {
                            showToast(d.error || '클라우드 작업 상태를 확인하지 못했습니다', 'error');
                            return;
                        }

                        const job = d.job;
                        document.getElementById('cloudGoogleStatus').dataset.jobProgress = `${job.direction}:${job.progress || 0}`;
                        if (job.state === 'accepted' || job.state === 'running') {
                            loadCloudStatus();
                            setTimeout(poll, 1200);
                            return;
                        }

                        if (job.state === 'completed') {
                            showToast('클라우드 동기화가 완료되었습니다', 'success');
                        } else {
                            showToast(job.error || '클라우드 동기화 실패', 'error');
                        }
                        loadCloudStatus();
                    })
                    .catch(() => showToast('클라우드 작업 상태 확인 실패', 'error'));
            };
            poll();
        }

            }).then(async r => ({ status: r.status, body: await r.json() }))

                        showToast(`클라우드 동기화 작업이 시작되었습니다: ${body.job.job_id}`, 'success');

        // ==========================================
        let isDragSelecting = false;
        let dragStartX = 0, dragStartY = 0;
        const selectionBox = document.createElement('div');
        selectionBox.id = 'selectionBox';
        selectionBox.style.cssText = 'position:fixed; background:rgba(99,102,241,0.2); border:2px solid var(--primary); pointer-events:none; z-index:9999; display:none;';
        document.body.appendChild(selectionBox);

        function initDragSelect() {
            const fileList = document.getElementById('fileList');
            if (!fileList) return;

            fileList.addEventListener('mousedown', (e) => {
                // 파일 항목이 아닌 빈 공간에서만 시작
                if (e.target.closest('.file-item') || e.target.closest('button') || e.target.closest('input')) return;
                if (e.button !== 0) return; // 왼쪽 버튼만

                isDragSelecting = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                selectionBox.style.left = dragStartX + 'px';
                selectionBox.style.top = dragStartY + 'px';
                selectionBox.style.width = '0';
                selectionBox.style.height = '0';
                selectionBox.style.display = 'block';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragSelecting) return;

                const x = Math.min(e.clientX, dragStartX);
                const y = Math.min(e.clientY, dragStartY);
                const w = Math.abs(e.clientX - dragStartX);
                const h = Math.abs(e.clientY - dragStartY);

                selectionBox.style.left = x + 'px';
                selectionBox.style.top = y + 'px';
                selectionBox.style.width = w + 'px';
                selectionBox.style.height = h + 'px';

                // 영역 내 파일 선택
                const boxRect = selectionBox.getBoundingClientRect();
                document.querySelectorAll('.file-item.data-item').forEach(item => {
                    const itemRect = item.getBoundingClientRect();
                    const intersects = !(itemRect.right < boxRect.left || itemRect.left > boxRect.right ||
                        itemRect.bottom < boxRect.top || itemRect.top > boxRect.bottom);
                    const checkbox = item.querySelector('.file-check');
                    if (checkbox) {
                        checkbox.checked = intersects;
                        if (intersects) {
                            selectedFiles.add(item.getAttribute('data-name'));
                        } else {
                            selectedFiles.delete(item.getAttribute('data-name'));
                        }
                    }
                });
            });

            document.addEventListener('mouseup', () => {
                if (isDragSelecting) {
                    isDragSelecting = false;
                    selectionBox.style.display = 'none';
                    updateBatchButtons();
                }
            });
        }

        function updateBatchButtons() {
            const count = selectedFiles.size;
            const batchBtn = document.getElementById('batchDownloadBtn');
            if (batchBtn) {
                batchBtn.textContent = count > 0 ? `선택 다운로드 (${count})` : '선택 다운로드';
            }
        }

                    }

                    widgetContent.innerHTML = d.favorites.slice(0, 5).map(f => `
                        <a href="/browse/${encodePath(f.path || '')}" style="display:flex; align-items:center; padding:8px 12px; color:var(--text); text-decoration:none; border-bottom:1px solid var(--border);">
                            <i class="fa-solid fa-folder-heart" style="color:var(--danger); margin-right:10px;"></i>
                            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(f.name)}</span>
                        </a>
                    `).join('');
                });
        }

        function applyCapabilities(capabilities) {
            window.APP_CAPABILITIES = capabilities || {};
            document.querySelectorAll('[data-capability]').forEach((element) => {
                const key = element.dataset.capability;
                if (!key) return;
                const available = !!window.APP_CAPABILITIES[key];
                element.style.display = available ? '' : 'none';
            });
        }

        function loadCapabilities() {
            fetch('/api/capabilities')
                .then(r => r.ok ? r.json() : {})
                .then(applyCapabilities)
                .catch(() => applyCapabilities({}));
        }

        // ==========================================
        // v7.2: 초기화
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadCapabilities();
            applyDirectoryCapabilities(window.CURRENT_CAPABILITIES || {});
            initDragDrop();
            initDragSelect();  // 드래그 선택 초기화
            renderTabs();
            loadFavoriteWidget();  // 즐겨찾기 위젯 로드

            // 파일 항목에 데이터 속성 추가 (이미 있을 수 있음)
            document.querySelectorAll('.file-item').forEach((item, index) => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.file-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedFileIndex = index;
                });
            });
        });
    </script>
